[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pss4"
version = "0.1.0"
description = "1D Periodic Fluctuational Electrodynamics Solver for near-field radiative heat transfer"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "matplotlib>=3.4",
]

[project.scripts]
pss4 = "main:main"

[tool.setuptools.packages.find]
where = ["."]
